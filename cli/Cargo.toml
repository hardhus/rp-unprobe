[package]
name = "unprobe-cli"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Host tool for rp-unprobe: flash RP2040/RP2350 over BOOTSEL without a button and stream the USB log"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hardhus/rp-unprobe"
readme = "../README.md"
keywords = ["rp2350", "rp2040", "pico", "uf2", "cargo-runner"]
categories = ["embedded", "command-line-utilities"]

[[bin]]
name = "unprobe"
path = "src/main.rs"

[dependencies]
addr2line = { version = "0.25", default-features = false, features = ["loader", "rustc-demangle"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
serialport = { version = "4.7", default-features = false, features = ["usbportinfo-interface"] }
